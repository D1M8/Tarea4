<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Activo - Logística</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #007bff;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registrar Nuevo Activo</h2>
        <form id="formActivo">
            <div class="form-group">
                <label for="idcategoria">ID Categoría:</label>
                <input type="number" id="idcategoria" name="idcategoria" required>
            </div>
            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion" name="descripcion" required>
            </div>
            <div class="form-group">
                <label for="fotografia">Fotografía (URL o nombre):</label>
                <input type="text" id="fotografia" name="fotografia">
            </div>
            <div class="form-group">
                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" required>
            </div>
            <div class="form-group">
                <label for="precio">Precio:</label>
                <input type="number" step="0.01" id="precio" name="precio" required>
            </div>
            <div class="form-group">
                <label for="fecharegistro">Fecha de Registro:</label>
                <input type="date" id="fecharegistro" name="fecharegistro" required>
            </div>
            <button type="submit">Guardar Activo</button>
        </form>
        <a href="index.html" class="back-link">← Volver al menú</a>
    </div>

    <script>
        document.getElementById('formActivo').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nuevoActivo = {
                idcategoria: document.getElementById('idcategoria').value,
                descripcion: document.getElementById('descripcion').value,
                fotografia: document.getElementById('fotografia').value,
                estado: document.getElementById('estado').value,
                precio: document.getElementById('precio').value,
                fecharegistro: document.getElementById('fecharegistro').value
            };

            try {
                const response = await fetch('/api/activos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(nuevoActivo)
                });

                if (response.ok) {
                    alert('¡Activo registrado con éxito!');
                    document.getElementById('formActivo').reset();
                } else {
                    alert('Error al registrar el activo.');
                }
            } catch (error) {
                console.error('Error de red:', error);
                alert('No se pudo conectar con el servidor.');
            }
        });
    </script>

</body>
</html>
