<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Activos - Logística</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #007bff;
        }
        .btn-group {
            margin-top: 20px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Módulo de Activos</h1>
        <p>Bienvenido al sistema de control y gestión de activos logísticos.</p>
        
        <div class="btn-group">
            <a href="registrar.html" class="btn">Registrar Nuevo Activo</a>
            <a href="listar.html" class="btn">Ver Listado de Activos</a>
        </div>
        
        <p style="margin-top: 30px;"><a href="/" style="color: #666; text-decoration: none;">← Volver al inicio</a></p>
    </div>

</html>
